stages:
  - validate
  - build
  - package
  - test
  - release

variables:
  OUTPUT_DIR: "$CI_PROJECT_DIR/build"
  BUILD_NUMBER: "$CI_PIPELINE_IID"

.os_matrix:
  parallel:
    matrix:
      # - OS_NAME: "ubuntu"
      #   OS_IMAGE: "ubuntu:20.04"
      #   HEADERS_PKG: "linux-headers-generic"
      #   PKG_EXT: "deb"
      # - OS_NAME: "ubuntu"
      #   OS_IMAGE: "ubuntu:22.04"
      #   HEADERS_PKG: "linux-headers-generic"
      #   PKG_EXT: "deb"
      # - OS_NAME: "ubuntu"
      #   OS_IMAGE: "ubuntu:24.04"
      #   HEADERS_PKG: "linux-headers-generic"
      #   PKG_EXT: "deb"
      # - OS_NAME: "debian"
      #   OS_IMAGE: "debian:11"
      #   HEADERS_PKG: "linux-headers-amd64"
      #   PKG_EXT: "deb"
      - OS_NAME: "debian"
        OS_IMAGE: "debian:12"
        HEADERS_PKG: "linux-headers-amd64"
        PKG_EXT: "deb"
      # - OS_NAME: "astra"
      #   OS_IMAGE: "registry.astralinux.ru/library/astra/ubi18:latest"
      #   HEADERS_PKG: "linux-headers-hardened-amd64"
      #   PKG_EXT: "deb"
      # - OS_NAME: "alt"
      #   OS_IMAGE: "alt:p10"
      #   HEADERS_PKG: "kernel-headers-modules-std-def"
      #   PKG_EXT: "rpm"
      # - OS_NAME: "redos"
      #   OS_IMAGE: "registry.red-soft.ru/ubi7/ubi:latest"
      #   HEADERS_PKG: "kernel-devel"
      #   PKG_EXT: "rpm"


.env_template:
  image: $OS_IMAGE
  before_script:
    - export TARGET_OS="$OS_NAME"
    - export TARGET_ARCH=$(uname -m)
    - |
      if command -v apt-get >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -yqq
        if [ -n "$HEADERS_PKG" ] && ! apt-cache show "$HEADERS_PKG" >/dev/null 2>&1; then
          FOUND_PKG=$(apt-cache search "^linux-headers-" | grep -E "hardened|generic|amd64|astra" | head -n 1 | awk '{print $1}');
          [ -n "$FOUND_PKG" ] && HEADERS_PKG="$FOUND_PKG";
        fi
        apt-get install -yqq build-essential sudo git kmod udev rpm $HEADERS_PKG
      elif command -v dnf >/dev/null 2>&1; then
        dnf update -y || true
        dnf install -y gcc gcc-c++ make sudo git kmod udev rpm-build kernel-devel-$(uname -r) || \
        dnf install -y gcc gcc-c++ make sudo git kmod udev rpm-build $HEADERS_PKG
      elif command -v yum >/dev/null 2>&1; then
        yum update -y || true
        yum install -y gcc gcc-c++ make sudo git kmod udev rpm-build kernel-devel-$(uname -r) || \
        yum install -y gcc gcc-c++ make sudo git kmod udev rpm-build $HEADERS_PKG
      fi
      
    - |
      export KERNEL_HEADERS=$(find /lib/modules -type l -name build 2>/dev/null | head -n 1)
      if [ -z "$KERNEL_HEADERS" ]; then
        export KERNEL_HEADERS=$(find /usr/src/kernels -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n 1)
      fi
      if [ -z "$KERNEL_HEADERS" ]; then
        export KERNEL_HEADERS=$(find /usr/src -maxdepth 1 -type d -name "linux-headers-*" 2>/dev/null | grep -v "common" | head -n 1)
      fi

validate:
  stage: validate
  extends: 
    - .env_template
    - .os_matrix
  script:
    - make help

build:
  stage: build
  extends: 
    - .env_template
    - .os_matrix
  script:
    - make ci-build
    - mkdir -p dist

    - cp -v build/accord-le.ko dist/ 
    - cp -v build/acle-tools-bin.tar.gz dist/
    - mkdir -p ci
    - echo "BUILD_NUMBER=$BUILD_NUMBER" > ci/build-info.env
    - echo "CI_PIPELINE_ID=$CI_PIPELINE_ID" >> ci/build-info.env
    - echo "CI_COMMIT_SHA=$CI_COMMIT_SHA" >> ci/build-info.env
    - echo "CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH" >> ci/build-info.env
    - echo "TARGET_OS=$OS_NAME" >> ci/build-info.env
    - echo "TARGET_ARCH=$TARGET_ARCH" >> ci/build-info.env
    - git describe --tags --always > ci/version.txt 2>/dev/null 
  artifacts:
    paths:
      - build/
      - dist/
      - ci/

package:
  stage: package
  extends: 
    - .env_template
    - .os_matrix
  script:
    - if [ "$PKG_EXT" = "rpm" ]; then
        echo "%_topdir $(pwd)/build/rpm" > ~/.rpmmacros;
        echo "%_tmppath /tmp" >> ~/.rpmmacros;
        echo "%__spec_install_post %{nil}" >> ~/.rpmmacros;
        echo "%_disable_source_fetch 1" >> ~/.rpmmacros;
        echo "%_allow_root_build 1" >> ~/.rpmmacros; 
      fi
    - mkdir -p driver
    - cp -v build/accord-le.ko driver/ 
    - make ci-package
  needs:
    - job: build
      artifacts: true
  artifacts:
    paths:
      - packages/

test:
  stage: test
  extends: 
    - .env_template
    - .os_matrix
  script:
    - mkdir -p tests
  
    - KO_FILE="dist/accord-le.ko"
    - if [ ! -f "$KO_FILE" ]; then
        echo "Модуль не найден"
        exit 1;
      fi
    - modinfo $KO_FILE | tee tests/modinfo.log
    
    - |
      H_K=$(uname -r)
      M_K=$(modinfo $KO_FILE | awk '/^vermagic:/ {print $2}')
      echo "Ядро хоста: $H_K" | tee -a tests/modinfo.log
      echo "Ядро модуля $M_K" | tee -a tests/modinfo.log
      if [ "$H_K" = "$M_K" ]; then 
        echo "Модуль совместим с ядром" | tee -a tests/modinfo.log
      else
        echo "Модуль не совместим с ядром" | tee -a tests/modinfo.log
        exit 1;
      fi

      
  artifacts:
    paths:
      - tests/
    when: always

release:
  stage: release
  image: "debian:12"
  script:
    - echo "build/:"
    - ls -lh build/
    - echo ""
    - echo "dist/:"
    - ls -lh dist/ 
    - echo ""
    - echo "packages/:"
    - ls -lR packages/ 
    - echo ""
    - echo "tests/:"
    - ls -lh tests/
    - echo ""
    - echo "ci/:"
    - ls -lh ci/ 
    - cat ci/build-info.env 
  needs:
    - job: build
      artifacts: true
    - job: package
      artifacts: true
    - job: test
      artifacts: true
  artifacts:
    paths:
      - build/
      - dist/
      - packages/
      - tests/
      - ci/
