stages:
  - validate
  - build
  - package
  - test
  - release

variables:
  OUTPUT_DIR: "$CI_PROJECT_DIR/build"
  BUILD_NUMBER: "$CI_PIPELINE_IID"

.os_matrix:
  parallel:
    matrix:
      # - OS_NAME: "ubuntu"
      #   OS_IMAGE: "ubuntu:20.04"
      #   HEADERS_PKG: "linux-headers-generic"
      #   PKG_EXT: "deb"
      #   EXTRA_PKGS: ""
      # - OS_NAME: "ubuntu"
      #   OS_IMAGE: "ubuntu:22.04"
      #   HEADERS_PKG: "linux-headers-generic"
      #   PKG_EXT: "deb"
      #   EXTRA_PKGS: ""
      # - OS_NAME: "ubuntu"
      #   OS_IMAGE: "ubuntu:24.04"
      #   HEADERS_PKG: "linux-headers-generic"
      #   PKG_EXT: "deb"
      #   EXTRA_PKGS: ""
      # - OS_NAME: "debian"
      #   OS_IMAGE: "debian:11"
      #   HEADERS_PKG: "linux-headers-amd64"
      #   PKG_EXT: "deb"
      #   EXTRA_PKGS: ""
      - OS_NAME: "debian"
        OS_IMAGE: "debian:12"
        HEADERS_PKG: "linux-headers-amd64"
        PKG_EXT: "deb"
        EXTRA_PKGS: ""
      # - OS_NAME: "astra"
      #   OS_IMAGE: "registry.astralinux.ru/library/astra/ubi18:latest"
      #   HEADERS_PKG: "linux-headers-hardened-amd64"
      #   PKG_EXT: "deb"
      #   EXTRA_PKGS: ""
      # - OS_NAME: "alt"
      #   OS_IMAGE: "alt:p10"
      #   HEADERS_PKG: "kernel-headers-modules-std-def"
      #   PKG_EXT: "rpm"
      #   EXTRA_PKGS: "rpm-build dpkg"
      # - OS_NAME: "redos"
      #   OS_IMAGE: "registry.red-soft.ru/ubi7/ubi:latest"
      #   HEADERS_PKG: "kernel-devel"
      #   PKG_EXT: "rpm"
      #   EXTRA_PKGS: "rpm-build gcc make"

.env_template:
  image: $OS_IMAGE
  before_script:
    - export TARGET_OS="$OS_NAME"
    - export TARGET_ARCH=$(uname -m)
    - |
      if command -v apt-get >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -yqq
        if [ -n "$HEADERS_PKG" ] && ! apt-cache show "$HEADERS_PKG" >/dev/null 2>&1; then
          FOUND_PKG=$(apt-cache search --names-only '^linux-headers-(hardened|generic|amd64|astra)' | head -n 1 | awk '{print $1}')
          [ -n "$FOUND_PKG" ] && HEADERS_PKG="$FOUND_PKG";
        fi
        apt-get install -yqq build-essential sudo git kmod udev rpm $HEADERS_PKG $EXTRA_PKGS
      elif command -v dnf >/dev/null 2>&1; then
        dnf update -y
        dnf install -y gcc gcc-c++ make sudo git kmod udev rpm-build kernel-devel-$(uname -r) $EXTRA_PKGS || \
        dnf install -y gcc gcc-c++ make sudo git kmod udev rpm-build $HEADERS_PKG $EXTRA_PKGS
      elif command -v yum >/dev/null 2>&1; then
        yum update -y
        yum install -y gcc gcc-c++ make sudo git kmod udev rpm-build kernel-devel-$(uname -r) $EXTRA_PKGS || \
        yum install -y gcc gcc-c++ make sudo git kmod udev rpm-build $HEADERS_PKG $EXTRA_PKGS
      fi
    - |
      export KERNEL_HEADERS=$(find /lib/modules -type l -name build | head -n 1)
      if [ -z "$KERNEL_HEADERS" ]; then
        export KERNEL_HEADERS=$(find /usr/src/kernels -mindepth 1 -maxdepth 1 -type d | head -n 1)
      fi
      if [ -z "$KERNEL_HEADERS" ]; then
        export KERNEL_HEADERS=$(find /usr/src -maxdepth 1 -type d -name "linux-headers-*" | grep -v "common" | head -n 1)
      fi

validate:
  stage: validate
  extends: 
    - .env_template
    - .os_matrix
  script:
    - make help

build:
  stage: build
  extends: 
    - .env_template
    - .os_matrix
  script:
    - make ci-build
  artifacts:
    paths:
      - build/

package:
  stage: package
  extends: 
    - .env_template
    - .os_matrix
  script:
    - |
      if [ "$PKG_EXT" = "rpm" ]; then
        echo "%_topdir $(pwd)/build/rpm" > ~/.rpmmacros
        echo "%_tmppath /tmp" >> ~/.rpmmacros
        echo "%__spec_install_post %{nil}" >> ~/.rpmmacros
        echo "%_disable_source_fetch 1" >> ~/.rpmmacros
        echo "%_allow_root_build 1" >> ~/.rpmmacros 
      fi
    - mkdir -p driver
    - cp -v build/accord-le.ko driver/
    - make ci-package
  needs:
    - job: build
      artifacts: true
  artifacts:
    paths:
      - build/packages/

test:
  stage: test
  extends: 
    - .env_template
    - .os_matrix
  script:
    - set -e
    - set -o pipefail

    - PKG_FILE=$(find build/packages/$OS_NAME -name "*.$PKG_EXT" | grep -iv "tools" | head -n 1)
    - |
      if [ -z "$PKG_FILE" ]; then
        echo "Пакет не найден"
        exit 1
      fi

    - |
      if [ "$PKG_EXT" = "deb" ]; then
        PKG_NAME=$(dpkg-deb -f $PKG_FILE Package)
      else
        PKG_NAME=$(rpm -qp --queryformat '%{NAME}' $PKG_FILE)
      fi

    - |
      if [ "$PKG_EXT" = "deb" ]; then
        dpkg -i $PKG_FILE || apt-get install -f -y
      elif [ "$PKG_EXT" = "rpm" ]; then
        if command -v dnf >/dev/null 2>&1; then
          dnf localinstall -y $PKG_FILE
        elif command -v yum >/dev/null 2>&1; then
          yum localinstall -y $PKG_FILE
        else
          rpm -i $PKG_FILE
        fi
      fi

    - KO_FILE=$(find /lib/modules -name "accord-le.ko" | head -n 1)
    - |
      if [ -z "$KO_FILE" ]; then
        echo "Модуль не найден"
        exit 1
      fi

    - MODULE_VERMagic=$(modinfo -F vermagic $KO_FILE)
    - KERNEL_VERSION=$(uname -r)
    - |
      if [[ "$MODULE_VERMagic" != *"$KERNEL_VERSION"* ]]; then
        echo "Vermagic не совпадает с версией ядра: $KERNEL_VERSION"
        exit 1
      fi

    - insmod $KO_FILE

    - |
      if ! lsmod | grep -q "accord_le"; then
        echo "Модуль не загружен"
        exit 1
      fi

    - rmmod accord_le

    - |
      if lsmod | grep -q "accord_le"; then
        echo "Модуль не выгружен"
        exit 1
      fi

    - |
      if [ "$PKG_EXT" = "deb" ]; then
        apt-get remove -y $PKG_NAME
      elif [ "$PKG_EXT" = "rpm" ]; then
        if command -v dnf >/dev/null 2>&1; then
          dnf remove -y $PKG_NAME
        elif command -v yum >/dev/null 2>&1; then
          yum remove -y $PKG_NAME
        else
          rpm -e $PKG_NAME
        fi
      fi

release:
  stage: release
  image: "debian:12"
  script:
    - ls -R build/packages/
  needs:
    - job: test
    - job: package
      artifacts: true