.env_template:
  image: $OS_IMAGE
  before_script:
    - export TARGET_OS="$OS_NAME"
    - export TARGET_ARCH=$(uname -m)
    - |
      if command -v apt-get >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -yqq
        if [ -n "$HEADERS_PKG" ] && ! apt-cache show "$HEADERS_PKG" >/dev/null 2>&1; then
          FOUND_PKG=$(apt-cache search "^linux-headers-" | grep -E "hardened|generic|amd64|astra" | head -n 1 | awk '{print $1}')
          [ -n "$FOUND_PKG" ] && HEADERS_PKG="$FOUND_PKG"
        fi
        apt-get install -yqq build-essential sudo git kmod udev rpm $HEADERS_PKG $EXTRA_PKGS
      elif command -v dnf >/dev/null 2>&1; then
        dnf update -y || true
        dnf install -y gcc gcc-c++ make sudo git kmod udev rpm-build kernel-devel-$(uname -r) $EXTRA_PKGS || \
        dnf install -y gcc gcc-c++ make sudo git kmod udev rpm-build $HEADERS_PKG $EXTRA_PKGS
      elif command -v yum >/dev/null 2>&1; then
        yum update -y || true
        yum install -y gcc gcc-c++ make sudo git kmod udev rpm-build kernel-devel-$(uname -r) $EXTRA_PKGS || \
        yum install -y gcc gcc-c++ make sudo git kmod udev rpm-build $HEADERS_PKG $EXTRA_PKGS
      fi

    - |
      export KERNEL_HEADERS="/lib/modules/$(uname -r)/build"
      if [ ! -d "$KERNEL_HEADERS" ]; then
        export KERNEL_HEADERS=$(find /lib/modules -type l -name build 2>/dev/null | head -n 1)
      fi
      if [ -z "$KERNEL_HEADERS" ]; then
        export KERNEL_HEADERS=$(find /usr/src/kernels -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n 1)
      fi
      if [ -z "$KERNEL_HEADERS" ]; then
        export KERNEL_HEADERS=$(find /usr/src -maxdepth 1 -type d -name "linux-headers-*" 2>/dev/null | grep -v "common" | head -n 1)
      fi
      echo "Kernel headers: $KERNEL_HEADERS"

package:
  stage: package
  extends: 
    - .env_template
    - .os_matrix
  script:
    - |
      if [ "$PKG_EXT" = "rpm" ]; then
        echo "%_topdir $(pwd)/build/rpm" > ~/.rpmmacros
        echo "%_tmppath /tmp" >> ~/.rpmmacros
        echo "%__spec_install_post %{nil}" >> ~/.rpmmacros
        echo "%_disable_source_fetch 1" >> ~/.rpmmacros
        echo "%_allow_root_build 1" >> ~/.rpmmacros
      fi
    - mkdir -p driver
    - cp -v build/accord-le.ko driver/
    - make ci-package
  needs:
    - job: build
      artifacts: true
  artifacts:
    paths:
      - packages/

test:
  stage: test
  extends: 
    - .env_template
    - .os_matrix
  script:
    - mkdir -p tests
    - echo "Структура packages/:"
    - find packages/ -type f
    - PKG_FILE=$(find packages/$OS_NAME -name "*.$PKG_EXT" | grep -iv "tools" | head -n 1)
    - echo "Найден пакет: $PKG_FILE" | tee -a tests/test-report.log
    - |
      if [ -z "$PKG_FILE" ]; then
        echo 'Пакет не найден' | tee -a tests/test-report.log
        exit 1
      fi
    - |
      if [ "$PKG_EXT" = "deb" ]; then
        PKG_NAME=$(dpkg-deb -f $PKG_FILE Package)
      else
        PKG_NAME=$(rpm -qp --queryformat '%{NAME}' $PKG_FILE)
      fi
    - echo "Установка пакета $PKG_NAME" | tee -a tests/test-report.log
    - |
      if [ "$PKG_EXT" = "deb" ]; then
        dpkg -i $PKG_FILE 2>&1 | tee -a tests/test-report.log || (apt-get install -f -y 2>&1 | tee -a tests/test-report.log && dpkg -i $PKG_FILE 2>&1 | tee -a tests/test-report.log)
      elif [ "$PKG_EXT" = "rpm" ]; then
        if command -v dnf >/dev/null 2>&1; then
          dnf install -y $PKG_FILE 2>&1 | tee -a tests/test-report.log
        elif command -v yum >/dev/null 2>&1; then
          yum install -y $PKG_FILE 2>&1 | tee -a tests/test-report.log
        else
          rpm -i $PKG_FILE 2>&1 | tee -a tests/test-report.log
        fi
      fi
    - KO_FILE=$(find /lib/modules -name "accord-le.ko" | head -n 1)
    - |
      if [ -z "$KO_FILE" ]; then
        echo "Модуль не найден" | tee -a tests/test-report.log
        find /lib/modules -name "*.ko" | head -10 | tee -a tests/test-report.log
        exit 1
      fi
    - echo "Модуль: $KO_FILE" | tee -a tests/test-report.log
    - modinfo $KO_FILE 2>&1 | tee -a tests/test-report.log
    - echo "Загрузка модуля" | tee -a tests/test-report.log
    - |
      if [ -w /dev/kmsg ]; then
        if insmod $KO_FILE 2>&1 | tee -a tests/test-report.log; then
          echo "Модуль загружен" | tee -a tests/test-report.log
          if lsmod | grep -q "accord_le\|accord-le"; then
            echo "Подтвержден в lsmod" | tee -a tests/test-report.log
          fi
        else
          echo "insmod failed" | tee -a tests/test-report.log
          dmesg | tail -20 | tee -a tests/test-report.log
          exit 1
        fi
      else
        modinfo $KO_FILE 2>/dev/null | grep -q "vermagic" && echo "Модуль валиден" | tee -a tests/test-report.log
      fi
    - lsmod > tests/lsmod.log 2>/dev/null || true
    - modinfo $KO_FILE > tests/modinfo.log 2>/dev/null || true
    - rmmod accord_le 2>/dev/null || rmmod accord-le 2>/dev/null || true
    - echo "Удаление пакета $PKG_NAME" | tee -a tests/test-report.log
    - |
      if [ "$PKG_EXT" = "deb" ]; then
        apt-get remove -y $PKG_NAME 2>&1 | tee -a tests/test-report.log
      elif [ "$PKG_EXT" = "rpm" ]; then
        if command -v dnf >/dev/null 2>&1; then
          dnf remove -y $PKG_NAME 2>&1 | tee -a tests/test-report.log
        elif command -v yum >/dev/null 2>&1; then
          yum remove -y $PKG_NAME 2>&1 | tee -a tests/test-report.log
        else
          rpm -e $PKG_NAME 2>&1 | tee -a tests/test-report.log
        fi
      fi
    - echo "Тесты пройдены" | tee -a tests/test-report.log
  artifacts:
    paths:
      - tests/
  needs:
    - job: package
      artifacts: true